<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VolleyStars</title>
  <link rel="icon" href="assets/volleyball.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ================= TEAM BUILDER ================= -->
  <section id="builder" class="screen">
    <header class="title">
      <img src="assets/volleyball.png" alt="" class="title-ball">
      <h1>VolleyStars</h1>
    </header>

    <div class="builder-layout">
      <div class="panel">
        <h2>Pick your team <span class="muted">(3–6)</span></h2>
        <p class="muted small">Click a creature, then click a spot on your court. Click a placed creature to remove it.
          Press <b>★</b> to choose your server.</p>
        <div id="roster" class="roster"></div>
      </div>

      <div class="panel">
        <h2>Your court</h2>
        <div class="court-preview">
          <div class="row-labels"><span>Back row</span><span>Front row</span></div>
          <div id="builderGrid" class="grid grid-left"></div>
          <div class="net-mini"></div>
        </div>
        <div class="builder-controls">
          <label>CPU difficulty
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="normal" selected>Normal</option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <button id="randomTeam" class="btn secondary">Random team</button>
          <button id="startMatch" class="btn primary" disabled>Start match</button>
        </div>
        <p id="builderMsg" class="muted small"></p>
      </div>
    </div>
  </section>

  <!-- ================= MATCH ================= -->
  <section id="match" class="screen hidden">
    <div class="scoreboard">
      <div class="team-score"><span class="label">You</span><span id="scorePlayer">0</span><span id="servePlayer" class="serve-dot">●</span></div>
      <div class="vs muted small">First to <span id="target">15</span></div>
      <div class="team-score"><span id="serveCpu" class="serve-dot">●</span><span id="scoreCpu">0</span><span class="label">CPU</span></div>
    </div>

    <div id="court" class="court">
      <div id="playerGrid" class="grid grid-left"></div>
      <div class="net"></div>
      <div id="cpuGrid" class="grid grid-right"></div>
      <img id="ball" class="ball" src="assets/volleyball.png" alt="ball">
    </div>

    <div class="action-bar">
      <div id="prompt" class="prompt">Get ready…</div>
      <div class="action-buttons">
        <button id="setToggle" class="btn toggle" disabled>Set: OFF</button>
        <button id="freeToggle" class="btn toggle" disabled>Send it over</button>
      </div>
    </div>

    <div id="log" class="log"></div>
    <button id="quitMatch" class="btn secondary small-btn">Quit to team select</button>
  </section>

  <!-- ================= END OF MATCH ================= -->
  <div id="endOverlay" class="overlay hidden">
    <div class="overlay-box">
      <h2 id="endTitle">You win!</h2>
      <p id="endScore"></p>
      <button id="playAgain" class="btn primary">Back to team select</button>
    </div>
  </div>

  <div id="tooltip" class="tooltip hidden"></div>

  <script src="js/creatures.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
